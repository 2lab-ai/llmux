[package]
name = "llmux-islands-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "llmux_islands_core"
path = "src/lib.rs"

[dependencies]
llmux = { path = ".." }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
zeroize = { version = "1.8.2", features = ["derive"] }

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "time"] }
